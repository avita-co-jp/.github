name: Spike
description: Spikeを行う時のIssue Type。
body:
  - type: textarea
    attributes:
      label: Related Links
      description: 関連する Issue や、 Slack のリンクを記載する。

  - type: textarea
    attributes:
      label: Description
      description: "Spikeの内容と理由を記載する。作成方法: https://github.com/avita-co-jp/documents/blob/main/%E9%96%8B%E7%99%BA%E3%83%AB%E3%83%BC%E3%83%AB/issue-types/spike.md"

  - type: textarea
    attributes:
      label: Output
      description: 調査結果をこちらに記載し、Team全体、またはProduct Ownerへ共有する。


  - type: textarea
    attributes:
      label: Notes
      description: 補足事項を記載する 
